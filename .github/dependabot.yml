# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Backend Python dependencies (FastAPI, LangChain, statsmodels, pmdarima, ...)
  # Manifest: data_forecaster/backend/requirements.txt
  - package-ecosystem: "pip"
    directory: "/data_forecaster/backend"
    schedule:
      interval: "weekly"
  # Frontend Python dependencies (Flask, Flask-Login, fpdf2, requests, ...)
  # Manifest: data_forecaster/frontend/requirements.txt
  - package-ecosystem: "pip"
    directory: "/data_forecaster/frontend"
    schedule:
      interval: "weekly"
